<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>כרטיסי תדלוק</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Heebo', sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-gray-950 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <span class="text-2xl">⛽</span>
      <span class="text-white font-bold text-lg">כרטיסי תדלוק</span>
    </div>
    <a href="admin.html" class="text-gray-600 text-xs hover:text-gray-400 transition-colors">ניהול</a>
  </header>

  <!-- Tabs -->
  <div class="flex bg-gray-900 border-b border-gray-800">
    <button
      id="tabFuel"
      onclick="switchTab('fuel')"
      class="flex-1 py-3 text-sm font-bold transition-all border-b-2 border-blue-500 text-blue-400"
    >
      ⛽ תדלוק
    </button>
    <button
      id="tabBalance"
      onclick="switchTab('balance')"
      class="flex-1 py-3 text-sm font-bold transition-all border-b-2 border-transparent text-gray-500"
    >
      🔍 בדיקת יתרה
    </button>
  </div>

  <main class="flex-1 flex items-start justify-center p-4 pt-8">
    <div class="w-full max-w-sm">

      <!-- ══ TAB: תדלוק ══ -->
      <div id="panelFuel" class="fade-in space-y-4">
        <p class="text-gray-400 text-sm text-center">מלא את הפרטים לאחר תדלוק</p>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-4">

          <div>
            <label class="text-gray-400 text-xs font-bold block mb-1.5">מספר כרטיס</label>
            <input
              id="fuelCard"
              type="text"
              inputmode="numeric"
              placeholder="1234"
              class="w-full bg-gray-800 border border-gray-700 text-white rounded-xl px-4 py-3 text-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition-all"
            />
          </div>

          <div>
            <label class="text-gray-400 text-xs font-bold block mb-1.5">שם המתדלק</label>
            <input
              id="fuelDriver"
              type="text"
              placeholder="ישראל ישראלי"
              class="w-full bg-gray-800 border border-gray-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition-all"
            />
          </div>

          <div>
            <label class="text-gray-400 text-xs font-bold block mb-1.5">כמות ליטרים שתודלקה</label>
            <input
              id="fuelLiters"
              type="number"
              inputmode="decimal"
              min="0.5"
              step="0.5"
              placeholder="50"
              class="w-full bg-gray-800 border border-gray-700 text-white rounded-xl px-4 py-3 text-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition-all"
            />
          </div>

          <button
            id="fuelBtn"
            onclick="submitFueling()"
            class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all text-base"
          >
            אשר תדלוק
          </button>
        </div>

        <div id="fuelResult" class="hidden fade-in"></div>
      </div>

      <!-- ══ TAB: בדיקת יתרה ══ -->
      <div id="panelBalance" class="hidden fade-in space-y-4">
        <p class="text-gray-400 text-sm text-center">הזן מספר כרטיס לבדיקת יתרת ליטרים</p>

        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 space-y-4">
          <div>
            <label class="text-gray-400 text-xs font-bold block mb-1.5">מספר כרטיס</label>
            <input
              id="balanceCard"
              type="text"
              inputmode="numeric"
              placeholder="1234"
              class="w-full bg-gray-800 border border-gray-700 text-white rounded-xl px-4 py-3 text-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/30 transition-all"
            />
          </div>

          <button
            id="balanceBtn"
            onclick="checkBalance()"
            class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all text-base"
          >
            בדוק יתרה
          </button>
        </div>

        <div id="balanceResult" class="hidden fade-in"></div>
      </div>

    </div>
  </main>

  <script src="config.js"></script>
  <script>

    // ── Tabs ──
    function switchTab(tab) {
      const isFuel = tab === 'fuel';
      document.getElementById('tabFuel').className    = 'flex-1 py-3 text-sm font-bold transition-all border-b-2 ' + (isFuel  ? 'border-blue-500 text-blue-400' : 'border-transparent text-gray-500');
      document.getElementById('tabBalance').className = 'flex-1 py-3 text-sm font-bold transition-all border-b-2 ' + (!isFuel ? 'border-blue-500 text-blue-400' : 'border-transparent text-gray-500');
      document.getElementById('panelFuel').classList.toggle('hidden',   !isFuel);
      document.getElementById('panelBalance').classList.toggle('hidden', isFuel);
      document.getElementById('fuelResult').classList.add('hidden');
      document.getElementById('balanceResult').classList.add('hidden');
    }

    // ── תדלוק ──
    async function submitFueling() {
      const card   = document.getElementById('fuelCard').value.trim();
      const driver = document.getElementById('fuelDriver').value.trim();
      const liters = parseFloat(document.getElementById('fuelLiters').value);
      const btn    = document.getElementById('fuelBtn');
      const result = document.getElementById('fuelResult');

      if (!card)                        return showResult(result, 'error', 'נא להזין מספר כרטיס');
      if (!driver)                      return showResult(result, 'error', 'נא להזין שם מתדלק');
      if (!liters || isNaN(liters) || liters <= 0) return showResult(result, 'error', 'נא להזין כמות ליטרים תקינה');

      btn.disabled    = true;
      btn.textContent = '...';
      result.classList.add('hidden');

      try {
        const res = await api({ action: 'logFueling', cardNumber: card, driverName: driver, liters });
        if (res.error) {
          showResult(result, 'error', res.error);
        } else {
          const badge = fuelBadge(res.fuelType);
          result.innerHTML = `
            <div class="bg-green-950 border border-green-800 rounded-2xl p-5 text-center space-y-2">
              <p class="text-green-400 font-black text-lg">✅ תדלוק בוצע בהצלחה</p>
              <p class="text-gray-300 text-sm">כרטיס <span class="text-white font-bold">${card}</span> ${badge}</p>
              <p class="text-white text-3xl font-black">${res.remaining.toLocaleString('he-IL')} <span class="text-gray-400 text-sm font-normal">ל׳ נותרו</span></p>
            </div>`;
          result.classList.remove('hidden');
          document.getElementById('fuelCard').value   = '';
          document.getElementById('fuelDriver').value  = '';
          document.getElementById('fuelLiters').value  = '';
        }
      } catch {
        showResult(result, 'error', 'שגיאת תקשורת, נסה שנית');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'אשר תדלוק';
      }
    }

    // ── בדיקת יתרה ──
    async function checkBalance() {
      const card   = document.getElementById('balanceCard').value.trim();
      const btn    = document.getElementById('balanceBtn');
      const result = document.getElementById('balanceResult');

      if (!card) return showResult(result, 'error', 'נא להזין מספר כרטיס');

      btn.disabled    = true;
      btn.textContent = '...';
      result.classList.add('hidden');

      try {
        const res = await api({ action: 'lookupCard', cardNumber: card });
        if (!res.found) {
          showResult(result, 'error', 'כרטיס ' + card + ' לא נמצא במערכת');
        } else {
          const c     = res.card;
          const badge = fuelBadge(c.fuelType);
          const color = c.liters <= 50 ? 'text-red-400' : c.liters <= 150 ? 'text-amber-400' : 'text-white';
          result.innerHTML = `
            <div class="bg-gray-900 border border-gray-700 rounded-2xl p-5 text-center space-y-2">
              <p class="text-gray-400 text-sm">כרטיס <span class="text-white font-bold">${c.cardNumber}</span> ${badge}</p>
              <p class="${color} text-5xl font-black">${c.liters.toLocaleString('he-IL')}</p>
              <p class="text-gray-500 text-sm">ליטרים שנותרו</p>
              ${c.notes ? `<p class="text-gray-600 text-xs mt-1">${c.notes}</p>` : ''}
            </div>`;
          result.classList.remove('hidden');
        }
      } catch {
        showResult(result, 'error', 'שגיאת תקשורת, נסה שנית');
      } finally {
        btn.disabled    = false;
        btn.textContent = 'בדוק יתרה';
      }
    }

    // Enter support
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (!document.getElementById('panelFuel').classList.contains('hidden')) submitFueling();
      else checkBalance();
    });

    // ── Helpers ──
    function fuelBadge(type) {
      return type === 'בנזין'
        ? '<span class="bg-green-900 text-green-300 text-xs font-bold px-2 py-0.5 rounded-lg">בנזין</span>'
        : '<span class="bg-amber-900 text-amber-300 text-xs font-bold px-2 py-0.5 rounded-lg">סולר</span>';
    }

    function showResult(el, type, msg) {
      const err = type === 'error';
      el.innerHTML = `<div class="${err ? 'bg-red-950 border-red-800 text-red-400' : 'bg-green-950 border-green-800 text-green-400'} border rounded-2xl p-4 text-center font-bold text-sm">${msg}</div>`;
      el.classList.remove('hidden');
    }

    async function api(body) {
      const res = await fetch(API_URL, {
        method:  'POST',
        headers: { 'Content-Type': 'text/plain' },
        body:    JSON.stringify(body)
      });
      return res.json();
    }
  </script>
</body>
</html>
